# CI/CD para Lambda de Autenticação via CPF
# - Pull Request → terraform plan (validação)
# - Push em main → npm ci + zip + terraform apply + commit do state
#
# State Terraform commitado no repo (abordagem pragmática para Learner Lab)

name: Deploy Lambda Auth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_db_host: ${{ secrets.DB_HOST }}
  TF_VAR_db_user: ${{ secrets.DB_USER }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  # ==================== PLAN (Pull Requests) ====================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

  # ==================== APPLY (Push em main) ====================
  apply:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform

      - name: Mostrar URL do API Gateway
        run: |
          echo "===================="
          echo "AUTH ENDPOINT:"
          terraform output -raw api_gateway_auth_endpoint 2>/dev/null || echo "(sem output ainda)"
          echo ""
          echo "===================="
        working-directory: terraform

      - name: Commitar state atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate || true
          git diff --cached --quiet || git commit -m "chore: atualizar terraform state [skip ci]"
          git push || true
